# When fake grok exits 0 but emits empty stdout, we must NOT see success events.
# Self-report may claim weird things; gate asserts silent-loss shape.
service: call-grok.agent
expect:
  - event: grok_agent.invoked
    op: "=="
    count: 1
  - event: grok_agent.process_exited
    op: "=="
    count: 1
  - event: grok_agent.stdout_empty
    op: "=="
    count: 1
  - event: grok_agent.failed
    op: ">="
    count: 1
