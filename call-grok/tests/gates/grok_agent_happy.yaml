# Red artifact: expected OBSERVED events for a successful grok-agent chat.
# Store is judge — self-report status is not sufficient.
service: call-grok.agent
expect:
  - event: grok_agent.invoked
    op: "=="
    count: 1
  - event: grok_agent.process_exited
    op: "=="
    count: 1
  - event: grok_agent.stdout_captured
    op: "=="
    count: 1
  - event: grok_agent.session_id_observed
    op: ">="
    count: 1
  - event: grok_agent.response_text_observed
    op: "=="
    count: 1
  - event: grok_agent.self_report_ok
    op: "=="
    count: 1
